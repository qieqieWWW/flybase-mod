plugins {
    // 直接使用gradle.properties中的loom版本（避免版本不一致）
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

// 读取gradle.properties中的变量
version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    // 阿里云镜像（解决国内依赖下载问题）
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    // 注册Mod源集
    mods {
        "flybase" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // 关键：配置数据生成任务（runData）
    runs {
        data {
            client()
            name = "Data Generation (Flybase)"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${projectDir}/src/generated/resources/"
            vmArg "-Dfabric-api.datagen.mod-id=${archives_base_name}"
            mainClass = "net.fabricmc.data.gen.DataGeneratorLauncher"
        }
    }
}

// Fabric API配置
fabricApi {
    configureDataGeneration()
}

dependencies {
    // Minecraft核心依赖
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Fabric API核心依赖（含数据生成API）
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // 关键：数据生成依赖（解决RecipeProvider等类无法解析）
    modImplementation "net.fabricmc.fabric-api:fabric-data-generation-api-v1:${fabric_api_version}"

    // 运行时依赖（确保游戏能正常加载）
    modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// 资源处理
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

// Java编译配置（强制使用Java 21）
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", base.archivesName
    duplicatesStrategy = 'exclude'
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// 发布配置
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}

tasks.sourcesJar {
    duplicatesStrategy = 'exclude'
}

// 确保runData任务依赖编译后的类
tasks.named("runData").configure {
    dependsOn(tasks.named("classes"))
}