# Gradle内存优化（提升运行稳定性）
org.gradle.jvmargs=-Xmx2G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric/Loom版本（1.21.11最新版）
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.4
loom_version=1.14-SNAPSHOT

# Mod基础信息
mod_version=1.0.0
maven_group=base.fly
archives_base_name=flybase

# Fabric API版本（与loader/MC版本匹配）
fabric_api_version=0.141.1+1.21.11

# 显式声明Java版本（必须为21，适配1.21.11）
java.version=21